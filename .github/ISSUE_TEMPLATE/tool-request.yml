name: 新增工具请求
description: 建议新增一个 AI 编程工具
title: "[Tool] "
labels: ["tool-request"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先确认该工具支持自定义 Base URL 或兼容网关，否则不适合本指南。
  - type: input
    id: name
    attributes:
      label: 工具名称
      placeholder: 例如 Crush
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 官网 / 仓库
      placeholder: https://github.com/...
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: 形态
      options:
        - 终端 CLI
        - VS Code / JetBrains 扩展
        - 桌面端
        - IDE
        - 其他
    validations:
      required: true
  - type: textarea
    id: customModel
    attributes:
      label: 如何接入自定义模型
      description: 支持哪些协议？配置文件在哪？请附官方文档链接。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 为什么建议加入
      description: 它解决了什么问题？对小白是否友好？
    validations:
      required: false